name: TINI FRONTEND CI - PUSH
on:
  push:
    branches: ["develop", "master"]
    tags:
      - v.**

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. 체크아웃
      - name: Checkout
        uses: actions/checkout@v3

      # Node.js 설정
      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      # 의존성 설치
      - name: Install dependencies
        run: npm ci

      # branch 이름 저장
      - name: 브랜치 네임 저장
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      # branch 태그 가져오기
      - name: 태그네임 가져오기
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
        id: tags

      # 브랜치 네임이 마스터일 경우에만 master 이름으로 지정하고 나머지는 develop 으로 지정한다.
      - name: 브랜치에 맞는 이미지 태그 지정
        uses: haya14busa/action-cond@v1
        id: cond_branch
        with:
          cond: ${{ steps.extract_branch.outputs.branch == 'master' }}
          if_true: 'master'
          if_false: 'develop'

      # Image Tag 생성 위한 github sha 저장
      - name: Image Tag 생성 위한 github sha 저장
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

      # TypeScript 타입 체크
      - name: TypeScript type check
        run: npx tsc --noEmit

      # Android 빌드를 위한 JDK 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle 캐시
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Android APK 빌드
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # APK 아티팩트 업로드
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tini-frontend-${{ steps.cond_branch.outputs.value }}-${{ env.COMMIT_SHORT_SHA }}
          path: android/app/build/outputs/apk/release/*.apk
